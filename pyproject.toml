[project]
name = "tiny-infer"
version = "0.1.0"
description = "A from-scratch LLM inference engine: continuous batching, paged KV cache, custom CUDA decode kernels"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "transformers>=4.45", "accelerate", "fastapi", "uvicorn", "httpx", "ninja"]

[project.optional-dependencies]
bench = ["matplotlib", "pytest"]

[project.scripts]
tiny-infer-serve = "tiny_infer.server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tiny_infer*"]

[tool.setuptools.package-data]
tiny_infer = ["csrc/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
